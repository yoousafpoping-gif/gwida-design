    <!--
      Theme bootstrap: resolve the stored preference and set `.dark` on <html>
      BEFORE first paint. Without this the page would render light and then
      snap to dark once React mounts. Mirrors THEME_KEY / applyTheme() in
      src/hooks/index.js — keep the key in sync.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gwida-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : 'dark' /* Midnight Atelier is the default */
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#070B16' : '#F5F7FB')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

  </body>
